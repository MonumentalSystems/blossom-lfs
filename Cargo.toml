[package]
name = "blossom-lfs"
version = "0.6.1"
rust-version = "1.94.1"
edition = "2021"
description = "Git LFS daemon for Blossom blob storage with chunking and lock support"
license = "MIT"
readme = "README.md"
repository = "https://github.com/MonumentalSystems/blossom-lfs"
keywords = ["git", "lfs", "blossom", "nostr", "storage"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
# blossom-rs 0.6.1 iroh transport references server types and validation helpers.
iroh = ["blossom-rs/server", "blossom-rs/iroh-transport", "blossom-rs/pkarr-discovery", "dep:iroh"]

[dependencies]
blossom-rs = { version = "0.6.1", default-features = false, features = ["client"] }
tokio = { version = "1.53.2", features = ["fs", "io-std", "macros", "rt-multi-thread", "sync"] }
nostr = "0.45.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
hex = "0.4.3"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "rustls"] }
base64 = "0.23.1"
urlencoding = "2.1.3"
anyhow = "1.0.104"
thiserror = "2.0.21"
bytes = "1.12.1"
futures-core = "0.3.34"
tokio-stream = "0.1.19"
iroh = { version = "1.3.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
proptest = "1.11.0"
tokio-test = "0.4.6"
axum = "0.8.9"
blossom-rs = { version = "0.6.1", default-features = false, features = ["server"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "rustls"] }
