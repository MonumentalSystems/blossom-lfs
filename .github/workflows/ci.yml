name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ${{ (github.event_name == 'pull_request' && github.actor != 'rsafier') && 'ubuntu-latest' || 'self-hosted' }}
    strategy:
      fail-fast: false
      matrix:
        features: ["", "iroh"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo build --locked --features "${{ matrix.features }}"
      - run: cargo clippy --locked --all-targets --features "${{ matrix.features }}" -- -D warnings
      - run: cargo test --locked --features "${{ matrix.features }}"
